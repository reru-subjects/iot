; ---------------------------------------------------------------
;  โปรเจกต์ตั้งต้นสำหรับสอบปฏิบัติ — NodeMCU (ESP8266)
;  คณะเทคโนโลยีสารสนเทศ มหาวิทยาลัยราชภัฏร้อยเอ็ด
;  ให้คัดลอกโฟลเดอร์นี้ไปเปลี่ยนชื่อเป็น รหัสนักศึกษา_ชุดข้อสอบ
;  เช่น 65123456_A แล้วเปิดด้วย File > Open Folder
; ---------------------------------------------------------------
[env:nodemcuv2]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800

; ถ้าอัปโหลดไม่ผ่าน ให้ลดความเร็วลงเป็น 115200
; ถ้าเครื่องมีพอร์ตหลายพอร์ต ให้ระบุพอร์ตเอง เช่น
; upload_port = COM3
; monitor_port = COM3
